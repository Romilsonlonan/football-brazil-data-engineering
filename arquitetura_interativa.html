                  var container = document.getElementById('mynetwork');

                  nodes = new vis.DataSet([{"color": "#1f77b4", "font": {"color": "white"}, "id": "fontes", "label": "\ud83d\udce1 Fontes de Dados", "shape": "box", "title": "Web Scraping (ESPN)\nAPIs Externas"}, {"color": "#ff7f0e", "font": {"color": "white"}, "id": "infrastructure", "label": "\ud83c\udfd7\ufe0f Camada de Infraestrutura", "shape": "box", "title": "Ingest\u00e3o de Dados\nAirflow (Orquestra\u00e7\u00e3o)\nWeb Scraping (Requests, BeautifulSoup4)"}, {"color": "#ff7f0e", "font": {"color": "white"}, "id": "ingestao", "label": "\ud83d\udce5 Ingest\u00e3o", "shape": "ellipse"}, {"color": "#ff7f0e", "font": {"color": "white"}, "id": "airflow", "label": "\u2699\ufe0f Airflow (DAGs)", "shape": "ellipse"}, {"color": "#ff7f0e", "font": {"color": "white"}, "id": "web_scraping", "label": "\ud83d\udd77\ufe0f Web Scraping", "shape": "ellipse"}, {"color": "#2ca02c", "font": {"color": "white"}, "id": "application", "label": "\ud83d\udccb Camada de Aplica\u00e7\u00e3o", "shape": "box", "title": "Use Cases (Casos de Uso)\nRegras de Aplica\u00e7\u00e3o"}, {"color": "#2ca02c", "font": {"color": "white"}, "id": "use_cases_classificacao", "label": "\ud83d\udccb Use Cases\nClassifica\u00e7\u00e3o", "shape": "ellipse"}, {"color": "#2ca02c", "font": {"color": "white"}, "id": "use_cases_elenco", "label": "\ud83d\udc65 Use Cases\nElenco", "shape": "ellipse"}, {"color": "#2ca02c", "font": {"color": "white"}, "id": "use_cases_vagas", "label": "\ud83c\udfc6 Use Cases\nVagas", "shape": "ellipse"}, {"color": "#d62728", "font": {"color": "white"}, "id": "domain", "label": "\ud83c\udfdb\ufe0f Camada de Dom\u00ednio", "shape": "box", "title": "Entidades\nObjetos de Valor\nInterfaces de Reposit\u00f3rio\nRegras de Neg\u00f3cio"}, {"color": "#d62728", "font": {"color": "white"}, "id": "domain_entities", "label": "\ud83d\udce6 Entidades\n(Classifica\u00e7\u00e3o, Time, Vagas)", "shape": "ellipse"}, {"color": "#d62728", "font": {"color": "white"}, "id": "domain_value_objects", "label": "\ riais\nGr\u00e1ficos Avan\u00e7ados\nBI corporativo"}, {"color": "#ff5555", "font": {"color": "white"}, "id": "seguranca", "label": "\ud83d\udd12 Seguran\u00e7a\n(Presidio)", "shape": "box", "title": "Detec\u00e7\u00e3o de PII\n(CPF, CNPJ, Telefone)\nM\u00e1scaramento de dados"}, {"color": "#55aaff", "font": {"color": "white"}, "id": "observabilidade", "label": "\ud83d\udce1 Observabilidade\n(Prometheus)", "shape": "box", "title": "M\u00e9tricas\nMonitoramento\nLogs"}]);
                  edges = new vis.DataSet([{"color": "#1f77b4", "from": "fontes", "to": "infrastructure", "width": 2}, {"color": "#ff7f0e", "from": "infrastructure", "to": "ingestao", "width": 1}, {"color": "#ff7f0e", "from": "infrastructure", "to": "airflow", "width": 1}, {"color": "#ff7f0e", "from": "infrastructure", "to": "web_scraping", "width": 1}, {"color": "#ff7f0e", "from": "infrastructure", "to": "application", "width": 2}, {"color": "#2ca02c", "from": "application", "to": "use_cases_classificacao", "width": 1}, {"color": "#2ca02c", "from": "application", "to": "use_cases_elenco", "width": 1}, {"color": "#2ca02c", "from": "application", "to": "use_cases_vagas", "width": 1}, {"color": "#2ca02c", "from": "application", "to": "domain", "width": 2}, {"color": "#d62728", "from": "domain", "to": "domain_entities", "width": 1}, {"color": "#d62728", "from": "domain", "to": "domain_value_objects", "width": 1}, {"color": "#d62728", "from": "domain", "to": "domain_repositories", "width": 1}, {"color": "#d62728", "from": "domain", "to": "data_lake", "width": 2}, {"color": "#9467bd", "from": "data_lake", "to": "bronze", "width": 1}, {"color": "#9467bd", "dashes": true, "from": "bronze", "to": "pipeline_classificacao", "width": 1}, {"color": "#9467bd", "dashes": true, "from": "bronze", "to": "pipeline_elenco", "width": 1}, {"color": "#9467bd", "dashes": true, "from": "bronze", "to": "silver", "width": 1}, {"color": "#9467bd", "dashes": true, "from": "silver", "to": "gold", "width": 1}, {"color": "#9467bd", "from": "data_lake", "to": "serving", "width": 2}, {"color": "#17becf", "from": "serving", "to": "fastapi", "width": 2}, {"color": "#17becf", "from": "serving", "to": "dashboard", "width": 2}, {"color": "#17becf", "from": "serving", "to": "superset", "width": 2}, {"color": "#ff5555", "dashes": true, "from": "serving", "to": "seguranca", "width": 1}, {"color": "#55aaff", "dashes": true, "from": "fastapi", "to": "observabilidade", "width": 1}]);

                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"nodes": {"shape": "box", "font": {"size": 14, "face": "arial"}, "borderWidth": 2}, "edges": {"color": {"inherit": true}, "arrows": {"to": {"enabled": true, "scaleFactor": 1}}, "smooth": {"type": "continuous"}}, "physics": {"enabled": true, "forceAtlas2Based": {"gravitationalConstant": -100, "centralGravity": 0.01, "springLength": 150, "springConstant": 0.08}, "solver": "forceAtlas2Based", "stabilization": {"enabled": true, "iterations": 200}}};

                  return network;

              }

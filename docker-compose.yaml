# ============================================
# Docker Compose - Airflow com SQLite + MinIO
# ============================================
x-airflow-common-depends-on:
  &airflow-common-depends-on {}

x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-docker.io/apache/airflow:2.10.5}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    #&airflow-common-env
    # PYTHONPATH para imports do projeto
    PYTHONPATH: /opt/airflow
    # SQLite para desenvolvimento local
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CELERY__RESULT_BACKEND: sqlite:////opt/airflow/airflow.db
    # Redis local (opcional, apenas se precisar de Celery)
    # AIRFLOW__CELERY__BROKER_URL: redis://:changeme@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  # Airflow image requires GID=0 for security
  # Use AIRFLOW_UID for UID if needed, but GID must be 0
  user: "${AIRFLOW_UID:-1000}:${AIRFLOW_GID:-0}"
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
    - airflow-db:/opt/airflow
    - ${AIRFLOW_PROJ_DIR:-.}/src:/opt/airflow/src
    - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
  networks:
    - lakehouse-network

services:
  airflow-init:
    <<: *airflow-common
    command: airflow db migrate
    restart: "no"
    depends_on:
      <<: *airflow-common-depends-on

  minio:
    image: docker.io/minio/minio:latest
    container_name: lakehouse-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data-volume:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always
    networks:
      - lakehouse-network

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ============================================
  # Apache Superset
  # ============================================
  superset:
    image: apache/superset:4.0.0
    container_name: lakehouse-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-changeme_generate_secure_key}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      ENABLE_PROXY_FIX: "true"
      SUPERSET_LOAD_EXAMPLES: "no"
      WEBDRIVER_TYPE: firefox
      WEBDRIVER_DOWNLOAD_METHOD: curl
    ports:
      - "8088:8088"
    volumes:
      - superset-data:/var/lib/superset
    command: >
      bash -c "
      echo '==> Inicializando Superset...' &&
      superset db upgrade &&
      superset fab create-admin --username admin --email admin@superset.com --password ${ADMIN_PASSWORD:-admin} --firstname Admin --lastname User || true &&
      superset init || true &&
      echo '==> Iniciando Servidor...' &&
      superset run -p 8088 --host 0.0.0.0 --with-threads"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always
    networks:
      - lakehouse-network

  # ============================================
  # API FastAPI - Brasileirão
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lakehouse-api
    ports:
      - "8000:8000"
    environment:
      # Configurações MinIO
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ENDPOINT: minio:9000
      # Configurações API
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_DEBUG: "true"
      DATA_PATH: /app/data
      PYTHONPATH: /app:/app/src
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/data:/app/data
    command: >
      bash -c "
      echo '==> Iniciando Lakehouse API...' &&
      python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --log-level debug"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    networks:
      - lakehouse-network

volumes:
  minio-data-volume:
  airflow-logs:
  airflow-db:
  superset-data:

networks:
  lakehouse-network:
    driver: bridge

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL metrics (via postgres-exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Brasileirão API metrics
  - job_name: 'Negócio (Brasileirão API)'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

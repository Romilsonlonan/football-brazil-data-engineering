name: CI - Lakehouse Brasileiro

on:
  push:
    branches: [ main, setup, gold-classificacao ]
  pull_request:
    branches: [ main, setup, gold-classificacao ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: |
          pre-commit run --all-files
          git diff --exit-code || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code || git commit -m "style: auto-fix from pre-commit"

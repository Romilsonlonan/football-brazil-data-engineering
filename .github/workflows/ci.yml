name: CI - Lakehouse Brasileiro

on:
  push:
    branches: [ main, gold-classificacao ]
  pull_request:
    branches: [ main, gold-classificacao ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff (Linter & Formatter)
        run: ruff check .

      - name: Run Security Scan (Credentials Check)
        run: |
          python scripts/pre-commit-check.py --ci-mode

  test-pipelines:
    runs-on: ubuntu-latest
    needs: lint-and-security
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run Unit Tests
        run: |
          poetry run pytest tests/unit/

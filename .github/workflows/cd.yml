name: CD - Deploy Lakehouse

on:
  workflow_run:
    workflows: ["CI - Lakehouse Brasileiro"]
    types: [completed]
    branches: [ main ]

jobs:
  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Simulação de Login e Push de Imagem
      - name: Build and Push Docker Image (Simulation)
        run: |
          echo "🔨 Construindo imagem Docker para a API..."
          docker build -t lakehouse-api:latest .
          echo "🚀 Simulação: Imagem enviada para o Registro de Containers!"

      # Simulação de Deploy no Kubernetes
      - name: Deploy to K8s (Simulation)
        run: |
          echo "📦 Aplicando manifestos do Kubernetes..."
          # kubectl apply -f k8s/
          echo "✅ Deploy concluído no Cluster Kubernetes!"

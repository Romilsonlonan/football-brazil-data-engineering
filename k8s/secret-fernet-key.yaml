# ============================================
# Kubernetes Secret - Fernet Key
# ============================================
# Este arquivo cria um segredo do Kubernetes para armazenar a chave Fernet
# do Airflow de forma segura.
#
# Uso: kubectl apply -f k8s/secret-fernet-key.yaml
#
# IMPORTANTE: Gere sua própria chave Fernet!
# Execute: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
# Depois atualize este arquivo com sua chave.
#
# NUNCA versione a chave real em repositórios! Use um secret manager em produção.

apiVersion: v1
kind: Secret
metadata:
  name: airflow-fernet-key
  namespace: lakehouse
  labels:
    app: airflow
    component: security
type: Opaque
stringData:
  # SUBSTITUA ESTA CHAVE POR UMA GERADA POR VOCÊ!
  # Execute: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  fernet-key: "SUA_CHAVE_FERNET_AQUI"
---
# ============================================
# Kubernetes Secret - Credenciais do Banco
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: lakehouse-db-credentials
  namespace: lakehouse
  labels:
    app: lakehouse
    component: database
type: Opaque
stringData:
  # Use valores de environment ou external secrets em produção
  postgres-user: lakehouse
  postgres-password: ${DB_PASSWORD}
  postgres-db: lakehouse
---
# ============================================
# Kubernetes Secret - Credenciais MinIO
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: lakehouse-minio-credentials
  namespace: lakehouse
  labels:
    app: lakehouse
    component: storage
type: Opaque
stringData:
  # Use valores de environment ou external secrets em produção
  minio-root-user: minioadmin
  minio-root-password: ${MINIO_ROOT_PASSWORD}

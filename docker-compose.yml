# ============================================
# Docker Compose - Lakehouse Brasileiro
# ============================================
# Versão do compose
version: "3.8"

services:
  # ========================================
  # Apache Airflow - Orquestração de PIPEs
  # ========================================
  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: lakehouse-airflow-webserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=basic_auth
      - AIRFLOW__CORE__ENABLE_XCOM_PICKLING=true
      - PYTHONUNBUFFERED=1
    user: "${AIRFLOW_UID:-1000}:${AIRFLOW_GID:-1000}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse-network
    depends_on:
      - airflow-postgres
      - airflow-init

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: lakehouse-airflow-scheduler
    restart: unless-stopped
    ports:
      - "8793:8793"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=basic_auth
      - AIRFLOW__CORE__ENABLE_XCOM_PICKLING=true
      - PYTHONUNBUFFERED=1
    user: "${AIRFLOW_UID:-1000}:${AIRFLOW_GID:-1000}"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse-network
    depends_on:
      - airflow-postgres
      - airflow-init

  airflow-triggerer:
    image: apache/airflow:2.10.5
    container_name: lakehouse-airflow-triggerer
    restart: unless-stopped
    ports:
      - "8794:8794"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__TRIGGERER__ENABLED=true
      - PYTHONUNBUFFERED=1
    user: "${AIRFLOW_UID:-1000}:${AIRFLOW_GID:-1000}"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse-network
    depends_on:
      - airflow-postgres
      - airflow-init

  airflow-postgres:
    image: postgres:16-alpine
    container_name: lakehouse-airflow-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse-network

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: lakehouse-airflow-init
    restart: "no"
    volumes:
      - ./dags:/opt/airflow/dags
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY}
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__API__AUTH_BACKENDS=basic_auth
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-admin}
      - PYTHONUNBUFFERED=1
    user: "${AIRFLOW_UID:-1000}:${AIRFLOW_GID:-1000}"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/data
        exec /entrypoint airflow version
    networks:
      - lakehouse-network

  # ========================================
  # Apache Superset - Visualização de Dados
  # ========================================
  superset:
    image: apache/superset:3.1.1
    container_name: lakehouse-superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    volumes:
      - superset-data:/app/pythonpath
      - ./data:/data
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-your-secret-key-change-in-production}
      - SUPERSET_DATABASE_DB_URI=postgresql+psycopg2://superset:superset@superset-db:5432/superset
      - SUPERSET_DATABASE_EXPOSE_DB=True
      - PYTHONUNBUFFERED=1
      - SUPERSET_LOAD_EXAMPLES=false
      - SUPERSET_ADMIN_USER=${SUPERSET_ADMIN_USER:-admin}
      - SUPERSET_ADMIN_FNAME=Admin
      - SUPERSET_ADMIN_LNAME=User
      - SUPERSET_ADMIN_EMAIL=admin@superset.local
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD:-admin}
    user: "${SUPERSET_UID:-1000}:${SUPERSET_GID:-1000}"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse-network
    depends_on:
      - superset-db
      - superset-init

  superset-db:
    image: postgres:16-alpine
    container_name: lakehouse-superset-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - postgres-superset-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${SUPERSET_DB_USER:-superset}
      - POSTGRES_PASSWORD=${SUPERSET_DB_PASSWORD:-superset}
      - POSTGRES_DB=superset
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lakehouse-network

  superset-init:
    image: apache/superset:3.1.1
    container_name: lakehouse-superset-init
    restart: "no"
    volumes:
      - superset-data:/app/pythonpath
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-your-secret-key-change-in-production}
      - SUPERSET_DATABASE_DB_URI=postgresql+psycopg2://superset:superset@superset-db:5432/superset
      - PYTHONUNBUFFERED=1
      - SUPERSET_LOAD_EXAMPLES=false
      - SUPERSET_ADMIN_USER=admin
      - SUPERSET_ADMIN_FNAME=Admin
      - SUPERSET_ADMIN_LNAME=User
      - SUPERSET_ADMIN_EMAIL=admin@superset.local
      - SUPERSET_ADMIN_PASSWORD=admin
    user: "${SUPERSET_UID:-1000}:${SUPERSET_GID:-1000}"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Inicializando Superset..."
        superset db upgrade
        superset fab create-admin \
          --username admin \
          --firstname Admin \
          --lastname User \
          --email admin@superset.local \
          --password admin || true
        superset init || true
        echo "Superset inicializado!"
    networks:
      - lakehouse-network
    depends_on:
      - superset-db

  # ========================================
  # MinIO - Armazenamento S3-Compatível
  # ========================================
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lakehouse-network

networks:
  lakehouse-network:
    driver: bridge

volumes:
  postgres-airflow-data:
    driver: local
  postgres-superset-data:
    driver: local
  minio-data:
    driver: local
  superset-data:
    driver: local
